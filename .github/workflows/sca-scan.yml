# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# A sample workflow which sets up periodic OSV-Scanner scanning for vulnerabilities,
# in addition to a PR check which fails if new vulnerabilities are introduced.
#
# For more examples and options, including how to ignore specific vulnerabilities,
# see https://google.github.io/osv-scanner/github-action/

on:
  push:
    branches: [main]
  pull_request:

name: SCA-scan

permissions:
  # Require writing security events to upload SARIF file to security tab
  security-events: write
  # Read commit contents
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install osv-scanner
        run: |
          curl -sSfL https://raw.githubusercontent.com/google/osv-scanner/main/scripts/install.sh | sh
      - name: Debug installation
        run: |
          echo "PATH=$PATH"
          echo "Searching HOME..."
          find "$HOME" -name "osv-scanner*" 2>/dev/null
          echo "Searching system..."
          sudo find /usr/local /opt -name "osv-scanner*" 2>/dev/null || true
      - name: Add discovered binary to PATH
        run: |
          OSV_DIR=$(dirname "$(find "$HOME" -name osv-scanner -type f | head -1)")
          echo "$OSV_DIR" >> "$GITHUB_PATH"
      - name: Verify installation
        run: |
          which osv-scanner
          osv-scanner --version
      - name: Create osv json file
        run: |    
          jq '{
            results: [
              {
                packages: [
                  .Packages | to_entries[] | {
                    package: {
                      name: .key,
                      version: .value.Version,
                      ecosystem: "CRAN"
                    }
                  }
                ]
              }
            ]
          }' renv.lock > osv-renv-lock.json
      - name: Perform scan
        run: |   
          osv-scanner --lockfile osv-scanner:./osv-renv-lock.json
